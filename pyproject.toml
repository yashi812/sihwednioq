[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[project]
name = "winddesk"
version = "0.1.0"
description = "Elexon-only GB wind forecast replay and accuracy analysis for January 2026."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "requests==2.32.3",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.scripts]
build = "pnpm install --frozen-lockfile && pnpm --dir frontend build"
